name: VCA restock monitor

# check 模式：一次运行连续监控约 5.5 小时（每 2 分钟查一次），结束前自动启动下一次，
# 所以只要手动点一次 Run workflow 就会一直跑下去。定时任务只是备用。
on:
  schedule:
    - cron: "3 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check / test-email / test-bark / probe / drill"
        default: check
        type: choice
        options: [check, test-email, test-bark, probe, drill]

# 只让一个 check 在跑；测试类模式各自独立，不用排队等监控结束。
concurrency:
  group: vca-${{ (github.event.inputs.mode || 'check') == 'check' && 'watch' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 用来启动下一次运行

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ github.event.inputs.mode || 'check' }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      PRODUCT_URL: ${{ vars.PRODUCT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Run
        run: |
          case "$MODE" in
            test-email) python monitor.py --test-email ;;
            test-bark)  python monitor.py --test-bark ;;
            probe)      python monitor.py --probe --timeout 15 ;;
            drill)      python monitor.py --drill ;;
            *)          python monitor.py --loop-minutes 325 --interval 120 ;;
          esac
      - name: Start next watch run
        if: always() && env.MODE == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=check
      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
